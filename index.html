<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*POSITION IS THE PROPERTY IN CSS WHICH IS BY DEFAULT STATIC*/
        * {
            padding: 0;
            margin: 0;
        }

        .box1 {
            background-color: #faebd7;
            position: absolute;    /* mtlb nearest positioned ancistor ke relative(or w.r.t) lagta hai 

            top: 0px;      
            
        }

        .box2 {
            background-color: aqua;
            /* position: relative;
            top: 34px;
            left: 56px; */
        }

        .box3 {
            background-color: blueviolet;
        }

        .box4 {
            background-color: purple;
        }

        .box {
            border: 2px solid black;
            width: 80vw;
            height: 133px;
            padding: 3px;
            margin: 3px;
        }

        .parent{
            padding: 43px;
            margin: 34px;
            border: 3px solid purple;
        }

    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
